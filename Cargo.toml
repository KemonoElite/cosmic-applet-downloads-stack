[package]
name = "cosmic-applet-downloads-stack"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "macOS-style fan view of your Downloads folder for the COSMIC panel"

[dependencies]
dirs = "6"
mime_guess = "2"
tokio = { version = "1", features = ["rt", "process"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Same feature set as the stock cosmic-applets (no a11y / x11).
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]
